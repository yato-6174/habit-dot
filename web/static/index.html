<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>習慣ドット</title><style>
body{margin:0;background:#f7f4ee;color:#27302b;font-family:Arial,'Yu Gothic',sans-serif}main{max-width:620px;margin:auto;padding:48px 20px}header p{color:#df8c2d;font-size:11px;font-weight:bold;letter-spacing:.15em}h1{font-family:Georgia,'Yu Mincho',serif;font-size:44px;font-weight:500;line-height:1.15;margin:8px 0 16px}.hint,small{color:#788078;font-size:13px}.card,.add,.data,.empty{background:#fffdfa;border:1px solid #e8e3d9;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 10px 24px #45381c0a}.top,footer,.data{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:20px;margin:0}.count{color:var(--c);font-size:12px;font-weight:bold}.dots{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.dot{width:12px;height:12px;border:1px solid #ded9d0;border-radius:50%}.dot.on{background:var(--c);border-color:var(--c)}button{font:inherit;cursor:pointer}.hold{--p:0deg;position:relative;min-width:140px;border:0;border-radius:14px;padding:10px 14px;color:#fff;background:conic-gradient(var(--c) var(--p),#e8e5de 0);overflow:hidden}.hold:before{content:'';position:absolute;inset:3px;border-radius:11px;background:var(--c)}.hold b,.hold small{position:relative;display:block}.hold small{color:#fff}.x{border:0;background:none;color:#aaa;font-size:23px}.add input{width:calc(100% - 74px);box-sizing:border-box;border:1px solid #e8e3d9;border-radius:12px;padding:12px}.add button{margin-left:6px;border:0;border-radius:12px;padding:12px;background:#27302b;color:#fff}.colors button{width:23px;height:23px;border:3px solid white;border-radius:50%;margin:14px 8px 0 0}.data button{border:1px solid #e8e3d9;border-radius:10px;padding:9px;background:#fff}.data .link{border:0;color:#788078;text-decoration:underline}.empty{text-align:center}#msg{text-align:center;color:#4b7655;font-size:13px}@media(max-width:480px){h1{font-size:38px}.data{display:block}.data div:last-child{margin-top:14px}.hold{min-width:125px}}</style></head><body><main><header><p>HABIT DOT</p><h1>今日の小さな<br>できたを残そう。</h1><span class="hint" id="date"></span></header><section id="list"></section><section class="add"><h2>習慣を追加</h2><div><input id="name" placeholder="例：10分読書"><button id="add">追加</button></div><div class="colors" id="colors"></div></section><section class="data"><div><h2>データとバックアップ</h2><span class="hint">記録はこのブラウザ内に保存されます。</span></div><div><button id="back">バックアップを作成</button><button class="link" id="restore">バックアップから復元</button><input id="file" type="file" hidden></div></section><p id="msg"></p></main><script>
const C=['#ef9b39','#e86b61','#68976d','#6888db','#a271c9'],K='habit-dot-v1';let hs=JSON.parse(localStorage.getItem(K)||'[]'),co=C[0];const key=d=>(d||new Date()).toLocaleDateString('en-CA'),today=key(),save=()=>localStorage.setItem(K,JSON.stringify(hs));date.textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(new Date());let ds=Array.from({length:new Date().getDate()},(_,i)=>{let d=new Date();d.setDate(i+1);return key(d)});function draw(){list.innerHTML=hs.length?'':'<div class="empty"><h2>最初のドットを育てよう</h2><p class="hint">下から続けたいことを追加してみてください。</p></div>';hs.forEach(h=>{let done=h.records.includes(today),m=h.records.filter(r=>r.slice(0,7)==today.slice(0,7)).length,e=document.createElement('article');e.className='card';e.style.setProperty('--c',h.color);e.innerHTML='<div class="top"><div><span class="count">'+h.records.length+' 回達成</span><h2></h2></div><button class="x">×</button></div><div class="dots">'+ds.map(d=>'<i class="dot '+(h.records.includes(d)?'on':'')+'"></i>').join('')+'</div><footer><span class="hint">今月 '+m+' 回</span><button class="hold '+(done?'done':'')+'"><b>'+ (done?'達成しました':'今日できた')+'</b>'+(!done?'<small>0.8秒 長押し</small>':'')+'</button></footer>';e.querySelector('h2').textContent=h.name;e.querySelector('.x').onclick=()=>{if(confirm('この習慣を削除しますか？')){hs=hs.filter(x=>x.id!=h.id);save();draw()}};let b=e.querySelector('.hold'),f,st,cancel=()=>{cancelAnimationFrame(f);b.style.setProperty('--p','0deg')};b.onpointerdown=()=>{if(done)return;st=performance.now();let t=n=>{let p=Math.min((n-st)/800,1);b.style.setProperty('--p',p*360+'deg');if(p==1){h.records.push(today);navigator.vibrate&&navigator.vibrate(35);save();draw()}else f=requestAnimationFrame(t)};f=requestAnimationFrame(t)};b.onpointerup=cancel;b.onpointerleave=cancel;b.onclick=()=>{if(done){h.records=h.records.filter(x=>x!=today);save();draw()}};list.append(e)})}colors.innerHTML=C.map(x=>'<button style="background:'+x+'"></button>').join('');[...colors.children].forEach((b,i)=>b.onclick=()=>{co=C[i];[...colors.children].forEach(x=>x.style.outline='none');b.style.outline='2px solid #27302b'});add.onclick=()=>{if(name.value.trim()){hs.push({id:crypto.randomUUID(),name:name.value.trim(),color:co,records:[]});name.value='';save();draw();msg.textContent='習慣を追加しました。'}};name.onkeydown=e=>e.key=='Enter'&&add.click();back.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,habits:hs})],{type:'application/json'}));a.download='habit-dot-'+today+'.json';a.click();msg.textContent='バックアップを作成しました。'};restore.onclick=()=>file.click();file.onchange=async()=>{try{let d=JSON.parse(await file.files[0].text());if(!Array.isArray(d.habits))throw 0;if(confirm('現在の記録を置き換えますか？')){hs=d.habits;save();draw();msg.textContent='復元しました。'}}catch{msg.textContent='読み込めないファイルです。'}};draw();
</script></body></html>
