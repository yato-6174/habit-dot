<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>習慣ドット</title>
  <style>
    :root{--ink:#111;--muted:#757575;--line:#dedede;--paper:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif}
    main{max-width:700px;margin:auto;padding:28px 22px 72px}header{border-top:2px solid var(--ink);padding:18px 0 34px}.eyebrow{margin:0 0 28px;font-size:11px;font-weight:700;letter-spacing:.16em}
    h1,h2,p{margin:0}h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(38px,9vw,64px);font-weight:400;letter-spacing:-.045em;line-height:1.05}h2{font-size:17px;letter-spacing:-.02em}.date,.hint{color:var(--muted);font-size:13px;line-height:1.6}.date{display:block;margin-top:18px}
    #list{border-top:1px solid var(--ink)}.habit{padding:23px 0 22px;border-bottom:1px solid var(--line)}.top,footer,.add-row,.data-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{font-size:11px;font-weight:700;letter-spacing:.08em}.title{margin-top:6px;font-size:22px}.x{width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:24px;line-height:1}.x:hover{color:var(--ink)}
    .dots{display:flex;flex-wrap:wrap;gap:7px;margin:25px 0}.dot{width:11px;height:11px;border:1px solid #bdbdbd;border-radius:50%}.dot.on{background:var(--ink);border-color:var(--ink)}
    .hold{--p:0deg;position:relative;min-width:148px;padding:3px;border:0;border-radius:999px;background:conic-gradient(var(--ink) var(--p),#e5e5e5 0);overflow:hidden}.hold-inner{display:block;border-radius:999px;padding:10px 14px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:700}.hold small{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:400}.hold.done{background:var(--ink)}.hold.done .hold-inner{background:var(--ink);color:#fff}.hold.done small{display:none}
    .empty{padding:52px 0;border-bottom:1px solid var(--line);text-align:left}.empty h2{font-family:Georgia,"Yu Mincho",serif;font-size:28px;font-weight:400}.empty .hint{display:block;margin-top:9px}
    .section{padding:28px 0;border-bottom:1px solid var(--line)}.section-head{margin-bottom:16px}.add-row input{flex:1;min-width:0;border:1px solid var(--ink);border-radius:0;padding:12px 13px;background:#fff;color:var(--ink);font:inherit;font-size:16px}.add-row button,.backup{border:1px solid var(--ink);border-radius:0;padding:12px 15px;background:var(--ink);color:#fff;font:inherit;font-size:13px;font-weight:700;white-space:nowrap}.backup{background:#fff;color:var(--ink)}.restore{margin-left:10px;border:0;padding:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;text-underline-offset:3px}.data-actions{align-items:flex-end}.data-actions>div{display:flex;align-items:center;flex-wrap:wrap;gap:0}.footer-note{padding-top:18px;color:var(--muted);font-size:11px;line-height:1.6}#msg{min-height:20px;margin-top:16px;font-size:13px;text-align:center}
    button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}@media(max-width:480px){main{padding:18px 16px 54px}header{padding-bottom:27px}.habit{padding:20px 0}.title{font-size:20px}.dots{gap:6px;margin:21px 0}.dot{width:10px;height:10px}.hold{min-width:135px}.hold-inner{padding:9px 11px}.data-actions{display:block}.data-actions>div{margin-top:14px}}
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">HABIT DOT / DAILY RECORD</p><h1>今日の小さな<br>できたを残そう。</h1><span class="date" id="date"></span></header>
    <section id="list" aria-live="polite"></section>
    <section class="section"><div class="section-head"><h2>習慣を追加</h2></div><div class="add-row"><input id="name" aria-label="習慣の名前" placeholder="例：10分読書"><button id="add">追加</button></div></section>
    <section class="section data-actions"><div><h2>データとバックアップ</h2><p class="hint">記録はこのブラウザ内に保存されます。</p></div><div><button class="backup" id="back">バックアップを作成</button><button class="restore" id="restore">復元</button><input id="file" type="file" accept="application/json" hidden></div></section>
    <p class="footer-note">長押しで記録。ドットは続けた日を静かに残します。</p><p id="msg" aria-live="polite"></p>
  </main>
  <script>
    const K='habit-dot-v1';let hs=JSON.parse(localStorage.getItem(K)||'[]');
    const dateKey=d=>(d||new Date()).toLocaleDateString('en-CA'),today=dateKey(),save=()=>localStorage.setItem(K,JSON.stringify(hs));
    const days=Array.from({length:new Date().getDate()},(_,i)=>{const d=new Date();d.setDate(i+1);return dateKey(d)});
    date.textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
    const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function draw(){list.innerHTML=hs.length?'':'<div class="empty"><h2>最初のドットを育てよう</h2><span class="hint">下から続けたいことを追加してみてください。</span></div>';hs.forEach(h=>{const done=h.records.includes(today),monthly=h.records.filter(r=>r.slice(0,7)===today.slice(0,7)).length,e=document.createElement('article');e.className='habit';e.innerHTML='<div class="top"><div><span class="count">'+h.records.length+' 回達成</span><h2 class="title">'+esc(h.name)+'</h2></div><button class="x" aria-label="'+esc(h.name)+'を削除">×</button></div><div class="dots" aria-label="今月の記録">'+days.map(d=>'<i class="dot '+(h.records.includes(d)?'on':'')+'"></i>').join('')+'</div><footer><span class="hint">今月 '+monthly+' 回</span><button class="hold '+(done?'done':'')+'"><span class="hold-inner">'+(done?'達成しました':'今日できた')+(done?'':'<small>0.8秒 長押し</small>')+'</span></button></footer>';e.querySelector('.x').onclick=()=>{if(confirm('「'+h.name+'」を削除しますか？')){hs=hs.filter(x=>x.id!==h.id);save();draw()}};const b=e.querySelector('.hold');let frame,start;const stop=()=>{cancelAnimationFrame(frame);b.style.setProperty('--p','0deg')};b.onpointerdown=()=>{if(done)return;start=performance.now();const tick=now=>{const p=Math.min((now-start)/800,1);b.style.setProperty('--p',p*360+'deg');if(p===1){h.records.push(today);navigator.vibrate&&navigator.vibrate(35);save();draw()}else frame=requestAnimationFrame(tick)};frame=requestAnimationFrame(tick)};b.onpointerup=stop;b.onpointerleave=stop;b.onpointercancel=stop;b.onclick=()=>{if(done){h.records=h.records.filter(x=>x!==today);save();draw()}};list.append(e)})}
    add.onclick=()=>{const value=name.value.trim();if(value){hs.push({id:crypto.randomUUID(),name:value,color:'#111',records:[]});name.value='';save();draw();msg.textContent='習慣を追加しました。'}};name.onkeydown=e=>e.key==='Enter'&&add.click();
    back.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,habits:hs})],{type:'application/json'}));a.download='habit-dot-'+today+'.json';a.click();msg.textContent='バックアップを作成しました。'};restore.onclick=()=>file.click();file.onchange=async()=>{try{const d=JSON.parse(await file.files[0].text());if(!Array.isArray(d.habits))throw 0;if(confirm('現在の記録を置き換えますか？')){hs=d.habits;save();draw();msg.textContent='復元しました。'}}catch{msg.textContent='読み込めないファイルです。'}};draw();
  </script>
</body>
</html>
